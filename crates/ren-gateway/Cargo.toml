[package]
name = "ren-gateway"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP forwarding, management, and control interface of the Ren LLM gateway."

# Ren's HTTP interface: forwarding, management, and controls. Management uses
# the store's Reader and Backup; SQL stays in ren-store. State machines and
# decisions stay pure (src/purity.rs). Never add a database driver or CLI parser
# (docs/architecture.md).
[dependencies]
axum.workspace = true
blake3.workspace = true
brotli-decompressor.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
h2 = "0.4.20"
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
ren-depot.workspace = true
ren-harness.workspace = true
ren-protocol.workspace = true
ren-recorder.workspace = true
ren-store.workspace = true
ren-supervisor.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7.1"
serde_with.workspace = true
strum.workspace = true
sync_wrapper = { version = "1.0", features = ["futures"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
brotli.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml.workspace = true

[lints]
workspace = true
