[package]
name = "ren-recorder"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded, non-blocking capture queue and recorded-fact model for the Ren LLM gateway."

# The capture queue and what it records. It writes only through its
# RecordSink port: never add a database driver, HTTP framework, or CLI parser
# (docs/architecture.md).
[dependencies]
blake3.workspace = true
bytes.workspace = true
fastcdc = "5.0.0"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-perl"] }
ren-depot.workspace = true
ren-harness.workspace = true
ren-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
