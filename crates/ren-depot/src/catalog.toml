# The packages Ren knows, read by `Depot::builtin`. Each Ren release pins one
# exact release per installable package; a package with no `release` is only
# adopted from the host's search path.
#
# Digests come from each publisher's own checksum file where it has one,
# cross-checked against GitHub's asset digests, as noted per package.

[[package]]
id = "claude"
kind = "client"
program = "claude"

[[package]]
id = "codex"
kind = "client"
program = "codex"

[[package]]
id = "pi"
kind = "client"
program = "pi"

[[package]]
id = "opencode"
kind = "client"
program = "opencode"

