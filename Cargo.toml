[workspace]
members = [
  "crates/ren-cli",
  "crates/ren-daemon",
  "crates/ren-depot",
  "crates/ren-gateway",
  "crates/ren-harness",
  "crates/ren-protocol",
  "crates/ren-recorder",
  "crates/ren-store",
  "crates/ren-supervisor",
  "xtask",
]
# xtask (repository tasks) builds only when asked for.
default-members = [
  "crates/ren-cli",
  "crates/ren-daemon",
  "crates/ren-depot",
  "crates/ren-gateway",
  "crates/ren-harness",
  "crates/ren-protocol",
  "crates/ren-recorder",
  "crates/ren-store",
  "crates/ren-supervisor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/roushou/ren"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roushou/ren"
rust-version = "1.99"

# Dependencies used by more than one crate, and our own crates. Each crate
# inherits these with `workspace = true` and adds its own features. Our own
# crates carry a version so they can be published; keep it equal to
# `workspace.package.version`.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
blake3 = "1.8.7"
brotli = "8.0"
brotli-decompressor = "5.0"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
futures-util = "0.3"
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
proptest = { version = "1", default-features = false, features = ["std"] }
ren-daemon = { path = "crates/ren-daemon", version = "0.1.0" }
ren-depot = { path = "crates/ren-depot", version = "0.1.0" }
ren-gateway = { path = "crates/ren-gateway", version = "0.1.0" }
ren-harness = { path = "crates/ren-harness", version = "0.1.0" }
ren-protocol = { path = "crates/ren-protocol", version = "0.1.0" }
ren-recorder = { path = "crates/ren-recorder", version = "0.1.0" }
ren-store = { path = "crates/ren-store", version = "0.1.0" }
ren-supervisor = { path = "crates/ren-supervisor", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_with = { version = "3.24", default-features = false, features = ["macros"] }
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.54"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.29", features = ["serde"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The design rules (AGENTS.md section 2), enforced for every target. The
# ambient calls listed in clippy.toml are allowed only in the capability
# implementations, each with `#[expect(clippy::disallowed_methods, reason)]`.
as_conversions = "deny"
disallowed_methods = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
match_wildcard_for_single_variants = "deny"
panic = "deny"
# One module layout: a module with submodules lives in `name/mod.rs`, never
# `name.rs` beside a `name/` directory.
self_named_module_files = "deny"
struct_excessive_bools = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
