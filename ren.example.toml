version = 1
listen = "127.0.0.1:8787"
# Relative paths are resolved beside this config file.
# data_dir = "./ren-data"
anthropic_base_url = "https://api.anthropic.com"
codex_base_url = "https://chatgpt.com/backend-api/codex"
# Public Responses endpoint used by Pi's openai provider (including ChatGPT sign-in).
openai_base_url = "https://api.openai.com"
# DeepSeek's Anthropic-compatible API; clients send their own DeepSeek key.
deepseek_base_url = "https://api.deepseek.com/anthropic"
max_concurrent_requests = 32
# max_concurrent_unnamed = 8 # optional: calls callers that are not [[users]] may run at once, together
connect_timeout_seconds = 10
response_header_timeout_seconds = 120
stream_idle_timeout_seconds = 120

[capture]
# Queue slots for body data; lifecycle records have their own reserved slots.
queue_capacity = 1024
# Body bytes held between capture and commit. Overflow is omitted and counted.
queue_bytes = 67108864 # 64 MiB
# Maximum captured prefix per direction, not a forwarding/body-size limit.
# Set to 0 for metadata only. Bodies may contain private prompts and tool output.
body_limit_bytes = 16777216 # 16 MiB
# Longest time a record waits before its batch commits.
commit_interval_ms = 50

[retention]
# Removes whole, finished calls, oldest first. Set false to keep everything.
enabled = true
max_age_seconds = 604800 # 7 days, measured from call start
max_calls = 10000
# Disk pages in use across ren.sqlite3 and blobs.sqlite3, plus the search
# index's share for retained calls. Bodies are deduplicated, so deleting a
# call frees only chunks nothing else references.
max_storage_bytes = 2147483648 # 2 GiB

[websocket]
# "relay" forwards Codex Responses over WebSocket; "refuse" answers the
# handshake with 426, and Codex falls back to HTTP/SSE for the session.
mode = "relay"
# Upgraded sockets open at once; more handshakes are refused with 426. Each
# call on a socket still counts against max_concurrent_requests.
max_channels = 16
# A side of a socket silent this long is pinged; silent twice this long, the
# socket is closed as unresponsive, which frees its channel. A running call
# whose upstream sends nothing for response_header_timeout_seconds (before its
# first message) or stream_idle_timeout_seconds (after) also closes the socket.
keepalive_seconds = 30

[buffer]
# Bytes held by all buffered requests; past it, new requests get 503. A
# ceiling on memory in use, not a reservation.
budget_bytes = 1073741824 # 1 GiB
idle_timeout_seconds = 30
total_timeout_seconds = 300

# Requests are buffered whole before forwarding; larger ones get 413. Defaults
# are the providers' documented limits. Each must be at most budget_bytes.
[buffer.request_limits]
anthropic = 33554432 # 32 MiB (Anthropic Messages: 32 MB)
codex = 536870912 # 512 MiB (no documented limit; OpenAI's is used)
openai = 536870912 # 512 MiB (OpenAI: 512 MB per request)
deepseek = 33554432 # 32 MiB (no documented limit; Anthropic Messages' is used)

[instance]
# "production" (the default) or "development". /health reports it; the UI
# marks a development gateway with a dev badge on its logo, and `ren doctor` and `ren run`
# name it. `cargo xtask dev` sets "development" for the dev slot.
environment = "production"

[control]
# Tailscale logins allowed to use the control API through Tailscale Serve.
# Local use (the ren control CLI) needs the daemon's control.token instead.
tailscale_logins = []

[runs]
# Folders agent runs may work in: Ren starts a client (Codex so far) in one of
# them, or a folder under one, and drives it through the control API. Runs are
# off while this is empty. Absolute paths; links are resolved.
roots = []

# Optional: named users of the gateway, people or machines, recorded on each
# call they make. A user is proven by a Tailscale login (through Tailscale
# Serve) or by a token sent in X-Ren-User-Token; `ren users token <id>` makes
# one and prints its digest.
# [[users]]
# id = "alice"
# tailscale_logins = ["alice@example.com"]
# token_blake3 = "<64 hex digits from ren users token alice>"
# max_concurrent = 4 # optional: calls alice may have running at once

# Optional: an operator-key upstream and a fallback to it (opt-in, bills per
# token). The key is read from the daemon's environment, never this file.
# [[upstreams]]
# id = "anthropic-key"
# provider = "anthropic"
# wire = "anthropic_messages" # optional: the provider's own wire format
# base_url = "https://api.anthropic.com"
# operator_key_env = "REN_ANTHROPIC_API_KEY"
# ingress = "direct" # optional: also mount it at /upstreams/anthropic-key; any caller bills the key
# users = ["alice"] # optional: only these [[users]] may use it, directly or by fallback
#
# [[policy.fallback]]
# id = "plan-limit"
# provider = "anthropic"
# to = "anthropic-key"
# on_status = [429]
#
# [[policy.block]]
# id = "no-opus"
# match = { provider = "anthropic", model = "claude-opus-4-1" }
# reason = "not on this gateway"
#
# [[policy.transform]]
# id = "drop-temperature"
# match = { endpoint = "messages" }
# steps = [{ op = "json_remove", path = "/temperature" }]
# reason = "example"

# Optional: a tool Ren can install for its agents, beside the built-in
# catalog (`ren tools list`). An entry with a built-in runtime's or
# utility's id replaces it; clients stay built in. Without `release`, the
# package is only found on the host's PATH. Each artifact is pinned by its
# sha256 (GitHub shows each release asset's digest).
# [[tools.package]]
# id = "acme-lint"
# kind = "utility" # or "runtime"
# program = "acme-lint"
#
# [tools.package.release]
# version = "0.3.0"
#
# [[tools.package.release.artifact]]
# platform = "linux_x64" # linux_arm64, macos_arm64
# url = "https://github.com/acme/acme-lint/releases/download/v0.3.0/acme-lint-x86_64-unknown-linux-gnu.tar.gz"
# sha256 = "<64 hex digits>"
# format = "tar_gz" # zip, bare
# program_at = "acme-lint-x86_64-unknown-linux-gnu/acme-lint"
